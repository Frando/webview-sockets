[workspace]
members = ["proto", "host", "webview-sockets", "demos"]
# Builds for wasm32-unknown-unknown with its own cfg and lockfile.
exclude = ["demos/wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Frando/webview-sockets"

[workspace.dependencies]
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
n0-error = "1.0.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(webview_sockets)", "cfg(wasm_browser)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
