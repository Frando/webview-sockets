[package]
name = "webview-sockets"
description = "A UdpSocket shaped like std::net::UdpSocket that also works in webview pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
webview-sockets-proto = { path = "../proto" }
js-sys = "0.3.105"
tracing = { workspace = true }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
web-sys = { version = "0.3.105", features = [
    "BinaryType",
    "CloseEvent",
    "Event",
    "MessageEvent",
    "Url",
    "WebSocket",
] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dev-dependencies]
# Pinned for the node test: tests/node/run.sh runs the wasm-bindgen CLI of
# exactly this version. Dev dependencies do not constrain users.
wasm-bindgen = "=0.2.128"

[[example]]
name = "node_test"
crate-type = ["cdylib"]

[lints]
workspace = true
