[package]
name = "webview-sockets-demo"
description = "Demos for webview-sockets: a plain-JS page and the udp-echo CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "udp-echo"
path = "src/bin/udp-echo.rs"

[dependencies]
clap.workspace = true
if-addrs = "0.15"
n0-error.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[lints]
workspace = true
